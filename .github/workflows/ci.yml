name: Linux checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy && rustup default 1.97.0
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build
      - run: node tests/native-qa.mjs
      - run: python3 -m unittest discover -s scripts/security -p "test_*.py"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run release
      - run: bash scripts/test-regressions.sh
      - run: python3 scripts/test-export.py
      - run: npm audit --audit-level=high
      - run: cargo install cargo-audit --version 0.22.2 --locked && python3 scripts/security/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: strict-rustsec-evidence
          path: target/security/
